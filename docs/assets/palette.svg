<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
  <title id="title">The Miles &amp; Moments color palette</title><desc id="desc">Sky BDE8F3, Pink A62963, Olive 626C3E, Ivory FCFBF8, Ink 243D3E.</desc>
  <g font-family="Arial,sans-serif" font-size="15">
    <rect width="192" height="150" rx="12" fill="#BDE8F3"/><text x="20" y="103" fill="#243D3E">Sky</text><text x="20" y="130" fill="#243D3E">#BDE8F3</text>
    <rect x="202" width="192" height="150" rx="12" fill="#A62963"/><text x="222" y="103" fill="#fff">Pink</text><text x="222" y="130" fill="#fff">#A62963</text>
    <rect x="404" width="192" height="150" rx="12" fill="#626C3E"/><text x="424" y="103" fill="#fff">Olive</text><text x="424" y="130" fill="#fff">#626C3E</text>
    <rect x="607" y="1" width="190" height="148" rx="12" fill="#FCFBF8" stroke="#CFD6CE"/><text x="626" y="103" fill="#243D3E">Ivory</text><text x="626" y="130" fill="#243D3E">#FCFBF8</text>
    <rect x="808" width="192" height="150" rx="12" fill="#243D3E"/><text x="828" y="103" fill="#fff">Ink</text><text x="828" y="130" fill="#fff">#243D3E</text>
  </g>
</svg>
